<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年度广州市工贸技师学院高层次人才考核打分系统</title>
  <!-- 引入 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .app-header { text-align: center; color: white; margin-bottom: 24px; }
    .app-header h1 { font-size: 28px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .app-header p { font-size: 14px; opacity: 0.85; margin-top: 6px; }
    .tab-buttons { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
    .tab-buttons button { padding: 12px 28px; cursor: pointer; border: none; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 10px; font-size: 16px; color: white; font-weight: 500; transition: all 0.3s ease; }
    .tab-buttons button:hover { background: rgba(255,255,255,0.35); transform: translateY(-1px); }
    .tab-buttons button.active { background: white; color: #764ba2; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .tab-content { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .hidden { display: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
    select { width: 100%; padding: 10px 14px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 15px; background: #f9fafb; transition: border-color 0.2s; }
    select:focus { outline: none; border-color: #764ba2; background: white; }
    .score-section-title { font-size: 16px; font-weight: 700; color: #1f2937; margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 2px solid #e5e7eb; }
    .score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .score-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; transition: all 0.2s; }
    .score-item:hover { border-color: #764ba2; box-shadow: 0 2px 8px rgba(118,75,162,0.1); }
    .score-item label { font-size: 13px; color: #4b5563; margin-bottom: 4px; }
    .score-item .max-score { font-size: 11px; color: #9ca3af; }
    .score-item input[type="number"] { width: 100%; padding: 8px 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 16px; font-weight: 600; margin-top: 4px; transition: border-color 0.2s; }
    .score-item input[type="number"]:focus { outline: none; border-color: #764ba2; }
    .total-bar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 24px; border-radius: 12px; margin: 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; }
    .total-bar .total-value { font-size: 28px; }
    .submit-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; font-size: 18px; font-weight: 600; border-radius: 10px; cursor: pointer; margin-top: 16px; width: 100%; transition: all 0.3s; box-shadow: 0 4px 15px rgba(118,75,162,0.3); }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118,75,162,0.4); }
    .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; transform: none; }
    .message { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
    .success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .rank-table-wrap { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
    th, td { border: 1px solid #e5e7eb; padding: 10px 8px; text-align: center; white-space: nowrap; }
    th { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: 600; position: sticky; top: 0; }
    tr:nth-child(even) { background: #f9fafb; }
    tr:hover { background: #ede9fe; }
    .rank-1 { background: #fef3c7 !important; font-weight: 700; }
    .rank-2 { background: #f3f4f6 !important; font-weight: 600; }
    .rank-3 { background: #fed7aa !important; font-weight: 600; }
    .refresh-btn { background: #764ba2; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 12px; transition: all 0.2s; }
    .refresh-btn:hover { background: #667eea; transform: translateY(-1px); }
    .person-name-display { font-size: 20px; font-weight: 700; color: #1f2937; text-align: center; margin-bottom: 16px; padding: 12px; background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1)); border-radius: 10px; }
    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .score-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .app-header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h1>2026年度广州市工贸技师学院高层次人才考核打分系统</h1>
  </div>

  <!-- 标签切换 -->
  <div class="tab-buttons">
    <button id="judgeTab" class="active" onclick="switchTab('judge')">评委打分</button>
    <button id="adminTab" onclick="switchTab('admin')">排名查看</button>
  </div>

  <!-- 评委打分界面 -->
  <div id="judgePanel" class="tab-content">
    <h2 style="margin-bottom: 16px; color: #1f2937;">评委打分</h2>
    
    <div class="form-row">
      <div>
        <label for="judgeSelect">评委</label>
        <select id="judgeSelect">
          <option value="">-- 请选择评委 --</option>
        </select>
      </div>
      <div>
        <label for="contestantSelect">被考核人</label>
        <select id="contestantSelect">
          <option value="">-- 请选择被考核人 --</option>
        </select>
      </div>
    </div>

    <div id="personNameDisplay" class="person-name-display hidden"></div>

    <div class="total-bar">
      <span>当前总分</span>
      <span class="total-value"><span id="totalScore">0</span> / 90</span>
    </div>

    <div id="scoreGroups"></div>

    <button class="submit-btn" id="submitBtn" disabled onclick="submitScore()">提交打分</button>
    <div id="judgeMessage" class="message hidden"></div>
  </div>

  <!-- 排名查看界面 -->
  <div id="adminPanel" class="tab-content hidden">
    <h2 style="margin-bottom: 12px; color: #1f2937;">实时排名</h2>
    <button class="refresh-btn" onclick="loadRankings()">刷新数据</button>
    <div class="rank-table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div id="adminMessage" class="message hidden"></div>
  </div>
</div>

<script>
  // ========== 1. 配置 Supabase 连接 ==========
  const SUPABASE_URL = 'https://pxvnnhvrnhhmpcqscbwg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Rvj_Px0ZAA1I8VPYGSItvw_7IVCP_jz';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ========== 2. 常量 ==========
  // 评委列表（9位）
  const JUDGES = Array.from({ length: 9 }, (_, i) => `评委${i + 1}`);

  // 被考核人员（23人）
  const PERSONS = [
    '陈矗', '林泽生', '陈立准', '冼星文', '钟建伟',
    '李群嘉', '谭伟创', '严宗浚', '李文远', '肖威',
    '吴之庆', '叶斌斌', '许俊毫', '黄新颍', '杨强华',
    '张光辉', '谢奇肯', '胡文凯', '朱妮迈', '郎永兵',
    '罗冬阳', '李骞', '黄道金'
  ];

  // 评分项配置：[key, 名称, 满分]
  const SCORE_ITEMS = [
    { key: 'item_1',  name: '师德师风', max: 30 },
    { key: 'item_2',  name: '继续教育', max: 2 },
    { key: 'item_3',  name: '学生管理', max: 3 },
    { key: 'item_4',  name: '专业知识', max: 5 },
    { key: 'item_5',  name: '教学工作', max: 5 },
    { key: 'item_6',  name: '教学效果', max: 5 },
    { key: 'item_7',  name: '竞赛工作', max: 20 },
    { key: 'item_8',  name: '一体化课改', max: 2 },
    { key: 'item_9',  name: '课题', max: 2 },
    { key: 'item_10', name: '教研成果', max: 2 },
    { key: 'item_11', name: '研发成果', max: 2 },
    { key: 'item_12', name: '主编教材', max: 2 },
    { key: 'item_13', name: '发明专利', max: 2 },
    { key: 'item_14', name: '论文论著', max: 2 },
    { key: 'item_15', name: '教学教研', max: 2 },
    { key: 'item_16', name: '教学创新', max: 2 },
    { key: 'item_17', name: '指导青年', max: 2 }
  ];

  const TOTAL_MAX = SCORE_ITEMS.reduce((sum, item) => sum + item.max, 0); // 90

  // 评分项分组（便于界面展示）
  const GROUPS = [
    { name: '师德师风与素养', items: SCORE_ITEMS.slice(0, 1) },
    { name: '教学能力', items: SCORE_ITEMS.slice(1, 6) },
    { name: '竞赛与课改', items: SCORE_ITEMS.slice(6, 8) },
    { name: '教研与成果', items: SCORE_ITEMS.slice(8, 14) },
    { name: '教学发展', items: SCORE_ITEMS.slice(14, 17) }
  ];

  // ========== 3. 初始化界面 ==========
  function init() {
    // 填充评委下拉
    const judgeSelect = document.getElementById('judgeSelect');
    JUDGES.forEach(j => {
      let opt = document.createElement('option');
      opt.value = j;
      opt.textContent = j;
      judgeSelect.appendChild(opt);
    });
    // 填充被考核人下拉
    const personSelect = document.getElementById('contestantSelect');
    PERSONS.forEach((p, idx) => {
      let opt = document.createElement('option');
      opt.value = p;
      opt.textContent = `${idx + 1}. ${p}`;
      personSelect.appendChild(opt);
    });

    // 生成分组打分区域
    const container = document.getElementById('scoreGroups');
    GROUPS.forEach(group => {
      let html = `<div class="score-section-title">${group.name}</div>`;
      html += '<div class="score-grid">';
      group.items.forEach(item => {
        html += `
          <div class="score-item">
            <label>${item.name}</label>
            <div class="max-score">满分 ${item.max} 分</div>
            <input type="number" id="${item.key}" min="0" max="${item.max}" step="0.5" placeholder="0-${item.max}" oninput="updateTotal()">
          </div>`;
      });
      html += '</div>';
      container.innerHTML += html;
    });

    // 监听选择变化
    document.getElementById('judgeSelect').addEventListener('change', checkExistingScore);
    document.getElementById('contestantSelect').addEventListener('change', onPersonChange);

    // 生成排名表头
    const headRow = document.getElementById('tableHead');
    let headHTML = '<tr><th>序号</th><th>姓名</th>';
    SCORE_ITEMS.forEach(item => {
      headHTML += `<th>${item.name}<br><small>(满分${item.max})</small></th>`;
    });
    headHTML += '<th>总分合计</th><th>最终平均分</th><th>排名</th></tr>';
    headRow.innerHTML = headHTML;

    checkExistingScore();
  }

  function onPersonChange() {
    const person = document.getElementById('contestantSelect').value;
    const nameDisplay = document.getElementById('personNameDisplay');
    if (person) {
      nameDisplay.textContent = `正在为「${person}」打分`;
      nameDisplay.classList.remove('hidden');
    } else {
      nameDisplay.classList.add('hidden');
    }
    checkExistingScore();
  }

  // 实时更新总分
  function updateTotal() {
    let total = 0;
    SCORE_ITEMS.forEach(item => {
      const val = parseFloat(document.getElementById(item.key).value);
      if (!isNaN(val)) total += val;
    });
    document.getElementById('totalScore').textContent = total.toFixed(1);
  }

  // 检查当前评委-被考核人组合是否已有分数
  async function checkExistingScore() {
    const judge = document.getElementById('judgeSelect').value;
    const person = document.getElementById('contestantSelect').value;
    const btn = document.getElementById('submitBtn');
    if (!judge || !person) {
      btn.disabled = true;
      return;
    }
    btn.disabled = false;

    const { data, error } = await db
      .from('scores')
      .select('*')
      .eq('judge_id', judge)
      .eq('contestant', person)
      .maybeSingle();

    if (data) {
      // 已有分数，填充表单
      SCORE_ITEMS.forEach(item => {
        document.getElementById(item.key).value = data[item.key] !== null && data[item.key] !== undefined ? data[item.key] : '';
      });
      updateTotal();
      btn.textContent = '更新打分';
    } else {
      // 清空表单
      SCORE_ITEMS.forEach(item => {
        document.getElementById(item.key).value = '';
      });
      updateTotal();
      btn.textContent = '提交打分';
    }
  }

  // 提交/更新分数
  async function submitScore() {
    const judge = document.getElementById('judgeSelect').value;
    const person = document.getElementById('contestantSelect').value;
    const messageDiv = document.getElementById('judgeMessage');
    messageDiv.classList.add('hidden');

    if (!judge || !person) {
      showMessage('judgeMessage', '请选择评委和被考核人', 'error');
      return;
    }

    // 收集分数
    const scoreObj = { judge_id: judge, contestant: person };
    for (const item of SCORE_ITEMS) {
      const val = parseFloat(document.getElementById(item.key).value);
      if (isNaN(val) || val < 0 || val > item.max) {
        showMessage('judgeMessage', `${item.name} 必须是 0-${item.max} 之间的数字`, 'error');
        return;
      }
      scoreObj[item.key] = val;
    }

    // 使用 upsert 操作
    const { error } = await db
      .from('scores')
      .upsert(scoreObj, { onConflict: 'judge_id, contestant' });

    if (error) {
      showMessage('judgeMessage', '提交失败: ' + error.message, 'error');
    } else {
      showMessage('judgeMessage', '提交成功！', 'success');
      document.getElementById('submitBtn').textContent = '更新打分';
    }
  }

  function showMessage(id, text, type) {
    const div = document.getElementById(id);
    div.textContent = text;
    div.className = `message ${type}`;
    div.classList.remove('hidden');
  }

  // ========== 4. 排名计算与显示 ==========
  async function loadRankings() {
    const { data, error } = await db
      .from('scores')
      .select('*')
      .order('contestant');

    if (error) {
      showMessage('adminMessage', '加载失败: ' + error.message, 'error');
      return;
    }

    // 按被考核人分组
    const group = {};
    PERSONS.forEach(p => group[p] = []);
    data.forEach(row => {
      if (group[row.contestant]) group[row.contestant].push(row);
    });

    // 计算每个被考核人的各项均分（去极值）
    const rankings = PERSONS.map(person => {
      const scores = group[person];
      const itemAvgs = [];
      let totalSum = 0;
      let validItems = 0;

      for (const item of SCORE_ITEMS) {
        const vals = scores.map(s => s[item.key]).filter(v => v !== null && v !== undefined);
        if (vals.length < 3) {
          // 不足3个评委，直接平均
          const avg = vals.length ? (vals.reduce((a,b) => a + b, 0) / vals.length) : null;
          itemAvgs.push(avg !== null ? avg.toFixed(2) : '-');
          if (avg !== null) { totalSum += avg; validItems++; }
        } else {
          // 去最高和最低
          const sorted = [...vals].sort((a,b) => a - b);
          const trimmed = sorted.slice(1, -1);
          const avg = trimmed.reduce((a,b) => a + b, 0) / trimmed.length;
          itemAvgs.push(avg.toFixed(2));
          totalSum += avg;
          validItems++;
        }
      }

      const finalAvg = validItems > 0 ? (totalSum / SCORE_ITEMS.length).toFixed(2) : '-';
      return { person, itemAvgs, sum: totalSum.toFixed(2), finalAvg, validItems };
    });

    // 按最终平均分排序，并赋予排名
    rankings.sort((a, b) => {
      if (a.finalAvg === '-') return 1;
      if (b.finalAvg === '-') return -1;
      return parseFloat(b.finalAvg) - parseFloat(a.finalAvg);
    });

    let rank = 1;
    let prevScore = null;
    rankings.forEach((r, idx) => {
      if (r.finalAvg === '-') {
        r.rank = '-';
      } else if (idx > 0 && r.finalAvg !== prevScore) {
        rank = idx + 1;
        r.rank = rank;
      } else {
        r.rank = rank;
      }
      prevScore = r.finalAvg;
    });

    // 输出表格
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    rankings.forEach((r, idx) => {
      const personIdx = PERSONS.indexOf(r.person) + 1;
      let row = `<td>${personIdx}</td><td style="text-align:left;font-weight:600;">${r.person}</td>`;
      r.itemAvgs.forEach(avg => row += `<td>${avg}</td>`);
      row += `<td style="font-weight:700;">${r.sum}</td><td style="font-weight:700;">${r.finalAvg}</td><td style="font-weight:700;">${r.rank}</td>`;
      let trClass = '';
      if (r.rank === 1) trClass = ' class="rank-1"';
      else if (r.rank === 2) trClass = ' class="rank-2"';
      else if (r.rank === 3) trClass = ' class="rank-3"';
      tbody.innerHTML += `<tr${trClass}>${row}</tr>`;
    });
  }

  // 切换标签页
  function switchTab(tab) {
    document.getElementById('judgePanel').classList.add('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('judgeTab').classList.remove('active');
    document.getElementById('adminTab').classList.remove('active');
    if (tab === 'judge') {
      document.getElementById('judgePanel').classList.remove('hidden');
      document.getElementById('judgeTab').classList.add('active');
    } else {
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('adminTab').classList.add('active');
      loadRankings();
    }
  }

  // 页面加载完成
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
